name: vo2-agent

services:
  vo2-etl-worker:
    build:
      context: .
      dockerfile: etl_worker/Dockerfile
    container_name: vo2-etl-worker
    user: "0:0"
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Seoul
    networks:
      - vanam-db-net
    volumes:
      # SMB 원본 폴더 (read-only mount, ETL은 절대 수정/삭제하지 않음)
      # Sputter chamber 1 — 사람 입력 로그 + 자동 CH1.xlsx + RGA
      - /volume1/VanaM_Sputter:/data:ro
      # ALD 장비 데이터 (NCD + Rayvac)
      - /volume1/VanaM_ALD:/data_ald:ro
      # VO2 측정 데이터 (.dat 트리)
      - /volume1/VanaM_VO2:/data_vo2:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  vo2-mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: vo2-mcp-server
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Seoul
    ports:
      - "127.0.0.1:3010:8000"
    networks:
      - vanam-db-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  vanam-db-net:
    external: true
