# main 에 push 할 때마다 Docker 이미지를 빌드해 GHCR 에 올린다.
# NAS 는 빌드하지 않고 deploy 스크립트가 git pull 한 커밋의 이미지(:<커밋 SHA>)를 받아 재시작만 한다.
# 태그: 커밋 SHA 전체 · latest. 모든 main 커밋에 이미지가 있어야 하므로 paths-ignore 를 쓰지 않는다.
name: docker-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 이미지마다 compose 의 build 설정(context·Dockerfile·빌드 인자)과 똑같이 빌드한다
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vo2-etl-worker
            context: .
            file: ./etl_worker/Dockerfile
            build-args: ""
          - image: vo2-mcp-server
            context: .
            file: ./mcp_server/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/leejunheon/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: 빌드·푸시 (${{ matrix.image }})
        uses: docker/build-push-action@v7
        # 빌드 기록 artifact(.dockerbuild)를 Actions 에 올리지 않는다(쓰지 않는 기록이 쌓이지 않게)
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # 패키지마다 최근 5개(태그 없는 버전 포함)만 남긴다. 권한 문제로 실패해도 빌드는 성공으로 둔다
      - name: 옛 이미지 정리 (${{ matrix.image }}, 최근 5개만)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 5
